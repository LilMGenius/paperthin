<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Paperthin">
  <!-- The master of the Paperthin mark. The four bands keep their source coordinates (box 284,395 683x464); the group
       places that box on the 512 icon canvas golden-grid planned in scripts/brand/layout.json (icon x 74.7, y 132.83,
       height 246.33). scripts/brand/render.mjs reads the bands from here for every other image. -->
  <g transform="translate(74.7 132.83) scale(0.530884) translate(-284 -395)">
    <g id="paperthin-mark">
      <polygon points="372,395 450,395 362,859 284,859" fill="#DFDEDF"/>
      <polygon points="450,395 528,395 440,859 362,859" fill="#909090"/>
      <polygon points="528,395 606,395 518,859 440,859" fill="#4D4C4C"/>
      <polygon points="606,395 967,395 879,859 518,859" fill="#161615"/>
    </g>
  </g>
</svg>